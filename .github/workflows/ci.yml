name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Backend ─────────────────────────────────────────────────────────
  backend:
    name: Backend tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run backend tests
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD_TEST }}
          SECRET_KEY: ${{ secrets.SECRET_KEY_TEST }}
        run: |
          PYTHONPATH=. python -m pytest tests/ --tb=short -q --no-cov

  # ── Frontend ────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js build + a11y lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: A11y lint (jsx-a11y)
        working-directory: frontend
        # Allow warnings to pass; errors block. This is a static a11y check
        # that enforces the rules in eslint.config.mjs (jsx-a11y).
        run: npm run lint
